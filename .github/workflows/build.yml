name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: geode-build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: ${{ steps.geode-build.outputs.build-output }}
